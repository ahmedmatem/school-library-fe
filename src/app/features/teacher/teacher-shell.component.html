<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h3 class="mb-0">Учителски панел</h3>
        <div class="text-muted small">Добавяне, одобрение и управление на ресурси.</div>
    </div>
</div>

@if (!isTeacher()) {
<div class="alert alert-warning">
    Само учители имат достъп до този панел.
</div>
} @else {
<ul class="nav nav-tabs mb-3">
    <li class="nav-item">
        <a class="nav-link" routerLink="add" routerLinkActive="active">Добави ресурс</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" routerLink="pending" routerLinkActive="active">Чакащи</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" routerLink="manage" routerLinkActive="active">Ресурси</a>
    </li>
</ul>

<router-outlet></router-outlet>
}
