<div class="container py-3">
    <div class="d-flex align-items-center gap-2 mb-3">
        <h3 class="m-0">Потребители</h3>
        <div class="ms-auto d-flex gap-2">
            <input class="form-control" style="max-width: 260px;" [value]="q()"
                (input)="q.set(($any($event.target)).value)" placeholder="Търси..." />
            <button class="btn btn-outline-primary" (click)="load()" [disabled]="loading()">Обнови</button>
        </div>
    </div>

    @if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
    }

    <div class="table-responsive">
        <table class="table table-sm align-middle">
            <thead>
                <tr>
                    <th>Име</th>
                    <th>Email</th>
                    <th>Клас</th>
                    <th>Роля</th>
                    <th>Последно</th>
                </tr>
            </thead>

            <tbody>
                @for (u of users(); track u.id) {
                <tr>
                    <td>{{ u.displayName }}</td>
                    <td>{{ u.email }}</td>
                    <td>
                        @if (u.grade && u.classCode) { {{ u.classCode }} } @else { <span class="text-muted">—</span> }
                    </td>
                    <td style="max-width: 180px;">
                        <select class="form-select form-select-sm" [value]="u.role"
                            (change)="setRole(u, ($any($event.target)).value)">
                            @for (r of roles; track r) {
                            <option [value]="r">{{ r }}</option>
                            }
                        </select>
                    </td>
                    <td class="text-muted small">{{ u.lastSeenAt ?? u.createdAt }}</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
